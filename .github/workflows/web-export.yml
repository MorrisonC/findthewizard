name: Deploy Web Export to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: threejs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: threejs

      - name: Run tests
        run: npm test
        working-directory: threejs

      - name: Build web export
        run: npm run build
        working-directory: threejs

      - name: Upload downloadable web export artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: threejs/dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: threejs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
